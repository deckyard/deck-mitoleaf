# Grimoire book configuration for the @deckyard/mitoleaf documentation.
#
#   grimoire build            -> site/
#   grimoire serve --watch    -> preview on :8080

[book]
title = "@deckyard/mitoleaf"
description = "Reader for the mitoLEAF human mitochondrial phylogeny."
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "grimoire"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
logo = "deckyard.svg"
favicon = "deckyard.svg"
repoUrl = "https://github.com/deckyard/deck-mitoleaf"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-mitoleaf/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true
bodyChars = 1200
